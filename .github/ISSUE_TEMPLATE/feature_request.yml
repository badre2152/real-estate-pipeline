name: 💡 Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Got an idea to improve the pipeline? Describe it below.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scraping (new city / new fields)
        - Data quality (new expectations / validations)
        - Silver layer (new features / transformations)
        - BI layer (new views / exports)
        - ML layer (new features / models)
        - Infrastructure (Docker / CI / logging)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve?
      placeholder: "e.g. Currently we can't filter by number of rooms in Power BI..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: "e.g. Add nb_chambres to bi_schema.v_annonces_full view..."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "e.g. Tried filtering in Power BI directly but data is missing..."
