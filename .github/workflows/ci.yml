name: CI Pipeline

on:
  push:               # runs on every push to any branch
  pull_request:       # runs on all pull requests
  workflow_dispatch:  # allow manual run from GitHub UI

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8 mypy pandas-stubs

      - name: Run flake8
        run: flake8 src/ --max-line-length=100 --exclude=src/__pycache__,src/*/__pycache__

      - name: Run mypy
        run: mypy src/ --config-file=mypy.ini --ignore-missing-imports

  # ── 2. Unit & Integration Tests ───────────────────────────────────────────
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     avito_test
      DB_USER:     postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pandas numpy psycopg2-binary python-dotenv pyarrow \
                      great-expectations==1.3.10 scikit-learn==1.4.2

      - name: Create logs & data directories
        run: mkdir -p logs data/bronze data/silver data/gold/bi data/gold/ml

      - name: Run tests with coverage
        run: |
          pytest src/tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── 3. Docker Build Check ─────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t avito-pipeline:ci .

      - name: Verify image runs
        run: |
          docker run --rm avito-pipeline:ci python -c "
          import pandas, psycopg2, great_expectations, pyarrow, sklearn
          print('All imports OK')
          "
